  <title>郵便番号ジェネレーター</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: "Hiragino Sans", "Yu Gothic", "Meiryo", sans-serif;
      background: #f0f4f8;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card {
      background: #fff;
      border-radius: 20px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.12);
      padding: 48px 56px;
      text-align: center;
      max-width: 440px;
      width: 90%;
    }

    h1 {
      font-size: 1.3rem;
      color: #555;
      font-weight: 500;
      margin-bottom: 40px;
      letter-spacing: 0.05em;
    }

    .result-area {
      min-height: 96px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 40px;
    }

    .postal-code {
      font-size: 3.2rem;
      font-weight: 700;
      color: #1a1a2e;
      letter-spacing: 0.08em;
      opacity: 0;
      transform: translateY(12px);
      transition: opacity 0.35s ease, transform 0.35s ease;
    }

    .postal-code.visible {
      opacity: 1;
      transform: translateY(0);
    }

    .postal-mark {
      font-size: 1.8rem;
      color: #e63946;
      margin-right: 6px;
      font-weight: 700;
    }

    button {
      background: #e63946;
      color: #fff;
      border: none;
      border-radius: 50px;
      padding: 16px 56px;
      font-size: 1.1rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s, box-shadow 0.2s;
      box-shadow: 0 4px 16px rgba(230, 57, 70, 0.35);
      font-family: inherit;
    }

    button:hover {
      background: #c1121f;
      box-shadow: 0 6px 20px rgba(230, 57, 70, 0.45);
    }

    button:active {
      transform: scale(0.97);
    }

    .hint {
      margin-top: 24px;
      font-size: 0.8rem;
      color: #aaa;
      letter-spacing: 0.03em;
    }
  </style>
</head>
